services:
  - type: web
    name: campusintent-api
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_KEY
        generateValue: true
